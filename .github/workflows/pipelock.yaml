name: Pipelock Security Scan

# Run the Pipelock content scan in its own workflow so the README badge reports
# this scan's result independently of the other CI checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipelock-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  security-scan:
    name: Pipelock scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Fixtures and scripts are excluded because a fixture is a deliberate
      # sample of the thing being detected. Scanning them reports the corpus as
      # findings, which is the scanner working, not a defect to fix.
      - name: Pipelock Scan
        uses: pipelab-org/pipelock@47c14c59b14f835f53971d22941b556f44f2baa0 # v3.7.0
        with:
          version: '3.6.0'
          scan-diff: 'true'
          fail-on-findings: 'true'
          test-vectors: 'false'
          exclude-paths: |
            fixtures/
            scripts/
